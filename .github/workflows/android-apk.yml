name: Android test build

# Builds an installable APK for testing on Android phones before the app is
# in the Play Store. Download it from the run's Artifacts section.
# Once the app's signing key is set up (see android-key.yml), builds are signed
# with it and install over each other; until then each build has a throwaway
# key, so uninstall the previous test build first. The public download on the
# website is built by site.yml.

on:
  pull_request:
    paths: ['app/**', '.github/workflows/android-apk.yml', '.github/scripts/android-signing.sh']
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android-apk.yml', '.github/scripts/android-signing.sh']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    # A healthy build takes about 15 minutes; fail fast instead of hanging.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number counts commits, so it only ever goes up.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - name: Signing key
        run: ../.github/scripts/android-signing.sh
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Google Sign-In needs these fingerprints in the app's Android OAuth
      # client. They are public (anyone can read them from the APK).
      - name: Key fingerprints
        run: |
          keytool -list -v -keystore "$WASLA_KEYSTORE_FILE" -storepass "$WASLA_KEY_PASSWORD" -alias wasla \
            | grep -E 'SHA1:|SHA256:' | tee -a "$GITHUB_STEP_SUMMARY"
      - run: flutter build apk --release --build-number $(git rev-list --count HEAD)
      - uses: actions/upload-artifact@v4
        with:
          name: wasla-android-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
