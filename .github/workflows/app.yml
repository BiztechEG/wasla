name: App checks

# Runs on pull requests only: what reaches main went through one, and the
# website workflow builds the app again there anyway. A new push to a pull
# request cancels the run for the push before it.
on:
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      # The admin dashboard and web sign-up run in a browser, so the web
      # build must keep compiling.
      - name: Build for the web
        run: flutter build web --release --no-web-resources-cdn
