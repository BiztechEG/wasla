name: Database tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations and permission tests
        run: supabase/tests/run.sh

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno check push/index.ts cleanup/index.ts email/index.ts
      - run: deno test
