name: wasla
description: "Wasla: internal team communication."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  cross_file: ^0.3.5+5
  emoji_picker_flutter: ^4.5.4
  excel: ^4.0.6
  file_picker: ^13.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  geolocator: ^14.0.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  lucide_icons_flutter: ^3.1.25
  path_provider: ^2.1.6
  pdf: ^3.12.0
  record: ^7.1.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.3
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
